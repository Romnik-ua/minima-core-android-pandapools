name: Build PandaPools Alert APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # gradle.properties pins the author's macOS Android Studio JDK — drop it on CI.
      - name: Unpin local JDK path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Unit tests (price-alert rule)
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.eurobuddha.pandapools.PriceAlertRuleTest'

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alert-${{ github.run_number }}
          name: PandaPools Alert build ${{ github.run_number }}
          body: PandaPools 0.9.23 + сповіщення при відхиленні ціни пулу MINIMA/USDT від MEXC на ≥10%.
          files: app/build/outputs/apk/release/*.apk
